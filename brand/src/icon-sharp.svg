<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/><stop offset="1" stop-color="#0B0B0B"/></linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#E50914" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E50914" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Filled outlines, never strokes: a stroke sits centred on its path and its
       mitre joins overshoot the corners, so drawn edges land away from the
       stated coordinates. That is why the two shapes would not align as strokes.
       Measured geometry, all interdependent — re-measure if you change any:
         top y=121, bottom y=391 (BOTH shapes, equal height 270)
         left x=121, right x=391  -> 270x270, a true square
         gap 11: white cut x=242, triangle starts x=253 -->
  <g transform="translate(256,256) scale(1.0000) translate(-256,-256)">
    <path d="M121.0 121.0 L155.0 121.0 L242.0 225.0 L242.0 277.9 L155.0 174.0 L155.0 391.0 L121.0 391.0 Z" fill="#FFFFFF"/>
    <path d="M253.0 121.0 L253.0 391.0 L391.0 256.0 Z" fill="#E50914"/>
  </g>
</svg>
