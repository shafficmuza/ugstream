name: ham_watch
description: Ham Watch — streaming app (consumer).
publish_to: "none"
version: 1.3.1+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0                     # HTTP client (interceptors for auth + token refresh)
  flutter_secure_storage: ^9.0.0 # Keychain/Keystore token storage
  provider: ^6.1.0               # simple state management (auth)
  cached_network_image: ^3.3.0   # poster/banner images
  video_player: ^2.8.0           # native HLS/MP4 playback (ExoPlayer/AVPlayer)
  url_launcher: ^6.2.0           # open hosted payment pages (card/DPO)
  flutter_chrome_cast: ^1.4.6    # Google Cast (Chromecast) on Android + iOS
  firebase_core: ^3.6.0          # required by firebase_messaging
  firebase_messaging: ^15.1.3    # push notifications (FCM -> APNs on iOS)
  flutter_local_notifications: ^17.2.3 # draws notifications while app is foregrounded
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# Launcher icons are GENERATED from these sources, never hand-copied into
# android/ or ios/ — both folders are gitignored and recreated by the build, so
# anything placed in them by hand is silently lost and the app ships with the
# default Flutter logo. `dart run flutter_launcher_icons` runs as part of
# muza-build-apk.sh and the iOS workflow, after the platform folders exist.
flutter_launcher_icons:
  image_path: "assets/brand/icon-1024.png"
  android: "ic_launcher"
  ios: true
  # Apple rejects any icon containing an alpha channel.
  remove_alpha_ios: true
  adaptive_icon_background: "assets/brand/icon-background-432.png"
  adaptive_icon_foreground: "assets/brand/icon-foreground-432.png"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
