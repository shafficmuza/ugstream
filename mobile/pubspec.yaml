name: ham_watch
description: Ham Watch — streaming app (consumer).
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0                     # HTTP client (interceptors for auth + token refresh)
  flutter_secure_storage: ^9.0.0 # Keychain/Keystore token storage
  provider: ^6.1.0               # simple state management (auth)
  cached_network_image: ^3.3.0   # poster/banner images
  video_player: ^2.8.0           # native HLS/MP4 playback (ExoPlayer/AVPlayer)
  url_launcher: ^6.2.0           # open hosted payment pages (card/DPO)
  flutter_chrome_cast: ^1.4.6    # Google Cast (Chromecast) on Android + iOS
  firebase_core: ^3.6.0          # required by firebase_messaging
  firebase_messaging: ^15.1.3    # push notifications (FCM -> APNs on iOS)
  flutter_local_notifications: ^17.2.3 # draws notifications while app is foregrounded
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
