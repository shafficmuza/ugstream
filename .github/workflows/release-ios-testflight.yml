name: Release iOS to TestFlight

# Signed iPhone build → TestFlight. Manual trigger (macOS runners bill 10x).
#
# Required secrets (repo Secrets tab, or the existing bound environment):
#   ASC_KEY_ID        App Store Connect API key's Key ID
#   ASC_ISSUER_ID     App Store Connect Issuer ID
#   ASC_KEY_P8        full contents of the downloaded AuthKey_xxx.p8
#   APPLE_TEAM_ID     Apple Developer Team ID
#   MATCH_PASSWORD    any strong passphrase (encrypts the stored certs)

on:
  # Ship iOS on the same trigger as Android so the two platforms never drift
  # apart. NOTE: macOS runners bill at 10x GitHub-minutes — switch back to
  # dispatch-only if the allowance gets tight.
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/release-ios-testflight.yml'
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    environment: DEPLOY_PASSWORD # exposes env-scoped secrets too
    permissions:
      contents: write # GITHUB_TOKEN pushes the encrypted certs branch
    steps:
      - uses: actions/checkout@v4

      # Apple requires builds with the iOS 26 SDK (Xcode 26+) for App Store
      # Connect uploads — the runner's default Xcode is older.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure iOS platform folder
        working-directory: mobile
        run: |
          # ios/ is committed (see scaffold-platforms.yml) so native config
          # survives. Only regenerate if it is somehow absent.
          if [ ! -d ios ]; then
            flutter create --org com.prosystemsug --project-name ham_watch --platforms ios .
            git checkout -- pubspec.yaml lib/main.dart || true
            rm -f test/widget_test.dart
            sed -i '' 's/com\.prosystemsug\.hamWatch/com.prosystemsug.muzawatch/g' ios/Runner.xcodeproj/project.pbxproj
            plutil -replace CFBundleDisplayName -string 'Muza Watch' ios/Runner/Info.plist
          fi

      - name: Dependencies + build (no codesign; fastlane signs)
        working-directory: mobile
        run: |
          flutter pub get
          # Apple rejects re-uploads with a duplicate build number, so use
          # the CI run number (monotonic) as CFBundleVersion.
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE=https://ham.sentepos.com/api/v1

      - name: Fastlane beta (sign + upload to TestFlight)
        working-directory: mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # Certs live on this repo's ios-certs branch; GITHUB_TOKEN can push it.
          MATCH_GIT_URL: https://github.com/${{ github.repository }}.git
        run: |
          export MATCH_GIT_BASIC_AUTHORIZATION=$(printf 'x-access-token:%s' '${{ secrets.GITHUB_TOKEN }}' | base64)
          fastlane ios beta

      # Proves what actually got signed into the uploaded build. Push failures
      # on device are otherwise ambiguous between "entitlement missing" and
      # "Apple declined", and this settles the first half without another
      # 20-minute round trip through TestFlight. Never fails the build — it is
      # evidence, not a gate.
      - name: Show push entitlement in the signed IPA
        if: always()
        working-directory: mobile
        run: |
          IPA=$(find build/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then echo "no IPA found; skipping"; exit 0; fi
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          unzip -q "$IPA" -d /tmp/ipacheck
          APP=$(find /tmp/ipacheck/Payload -maxdepth 1 -name '*.app' | head -1)
          echo "--- entitlements ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null || echo "(could not read entitlements)"
          echo "--- provisioning profile ---"
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null \
            | plutil -extract Entitlements xml1 -o - - 2>/dev/null \
            || echo "(could not read profile)"
