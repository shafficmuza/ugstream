name: Build Android APK

# Builds the Flutter APK whenever the mobile app changes (or on demand) and
# deploys it to the server so the login page's "Download Android app" button
# serves the latest build.
#
# Deploy credentials, matching how they were configured in this repo:
#   vars.DEPLOY_HOST / vars.DEPLOY_USER    — repository Variables
#   secrets.DEPLOY_PASSWORD                — a secret inside the environment
#                                            named "DEPLOY_PASSWORD" (bound
#                                            via the job's `environment:`)

# Manual trigger only. Android releases are built on the server instead
# (/usr/local/bin/muza-build-apk.sh), which is why Flutter and the Android SDK
# are installed there: the APK is large, the build is slow, and running it on
# every push burns Actions minutes that iOS genuinely needs — macOS runners are
# billed at 10x and are the only way to produce an iOS build at all.
#
# Kept rather than deleted so a clean-room build is available on demand when
# something looks wrong with the server toolchain.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Binds the environment holding the deploy password secret.
    environment: DEPLOY_PASSWORD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ is gitignored — generate it around the committed source,
      # then restore our pubspec/main (flutter create may overwrite them).
      - name: Ensure Android platform folder
        working-directory: mobile
        run: |
          # android/ is committed so native config (Cast SDK, permissions)
          # persists; only regenerate if missing.
          if [ ! -d android ]; then
            flutter create --org com.prosystemsug --project-name ham_watch --platforms android .
            git checkout -- pubspec.yaml lib/main.dart || true
            rm -f test/widget_test.dart
            sed -i 's/com\.prosystemsug\.ham_watch/com.prosystemsug.muzawatch/g' android/app/build.gradle* android/app/src/*/AndroidManifest.xml 2>/dev/null || true
            sed -i 's/android:label="ham_watch"/android:label="Muza Watch"/g' android/app/src/main/AndroidManifest.xml || true
          fi

      # Sign the sideload APK with the same upload key Play will use. Without
      # this CI would fall back to debug keys (see build.gradle.kts) and the
      # APK served from ham.sentepos.com would have a different signature from
      # the Play build — Android refuses to update across a signature change.
      - name: Restore upload keystore
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 not set — APK will be debug-signed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          cat > key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - name: Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Tests
        working-directory: mobile
        run: flutter test

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --dart-define=API_BASE=https://muzawatch.com/api/v1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ham-watch-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      # Drops the APK where the backend serves static uploads:
      # https://ham.sentepos.com/api/uploads/ham-watch.apk
      - name: Deploy APK to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: mobile/build/app/outputs/flutter-apk/app-release.apk
          target: /root/ugstream/backend/uploads/
          strip_components: 5

      - name: Rename to ham-watch.apk
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: mv -f /root/ugstream/backend/uploads/app-release.apk /root/ugstream/backend/uploads/ham-watch.apk
